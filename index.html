:root{--navy:#122a44;--teal:#007f78;--bg:#f4f7fb;--line:#dce5ed;--ink:#193148;--muted:#536a7d;--red:#ad353b;--green:#08745c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.48 system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--navy);color:white;padding:22px max(20px,4vw)}header .top{display:flex;justify-content:space-between;align-items:start;gap:20px;flex-wrap:wrap}h1{margin:0;font-size:clamp(24px,3vw,36px)}header p{margin:5px 0;opacity:.9}.lang{display:flex;gap:8px;align-items:center}.lang button{background:transparent;border:1px solid #a9bac9;color:white}.lang button.active{background:white;color:var(--navy)}main{max-width:1600px;margin:auto;padding:22px max(16px,3vw) 60px}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #122a4408}.heading{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:8px 0}p{margin:8px 0}.muted,small{color:var(--muted)}button,select{font:inherit}button{border:1px solid #b6cbd6;border-radius:8px;background:white;padding:9px 12px;cursor:pointer;color:var(--ink)}button:hover{border-color:var(--teal)}button.active,.primary{background:var(--teal);color:white;border-color:var(--teal)}button:focus-visible,input:focus-visible{outline:3px solid #65c5c0}button:disabled{opacity:.45;cursor:not-allowed}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px}.control{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fafcfd}.control label{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13px}.control output{white-space:nowrap;color:var(--teal)}input[type=range]{width:100%;accent-color:var(--teal)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.sub{padding:14px;border:1px solid var(--line);border-radius:10px;min-width:0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kpi{padding:12px;background:#eef5f6;border-radius:10px}.kpi span{display:block;color:var(--muted);font-size:12px}.kpi strong{font-size:22px}.negative{color:var(--red)}.positive{color:var(--green)}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left}td:not(:first-child),th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}tr.em{background:#edf7f6;font-weight:650}tr.total{background:#dcefeb;font-weight:750}tr.highlight{outline:2px solid var(--teal);outline-offset:-2px}tr.clickable{cursor:pointer}tr.clickable:hover{background:#d4eeea}.equation{padding:12px;background:#eaf3f8;border-radius:9px;font-weight:650;text-align:center;margin:12px 0}.notice{padding:12px;border-left:4px solid var(--teal);background:#eef8f6;margin:12px 0}.warning{border-left-color:#b77a19;background:#fff7e8}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:15px 0}.tabs button{font-size:13px}.arrow{text-align:center;font-size:24px;color:var(--teal);margin:6px}.pill{display:inline-block;padding:3px 8px;background:#e7f3f1;border-radius:99px;font-size:12px;color:#12645c}.details{margin-top:12px}.details summary{cursor:pointer;font-weight:650}.quizoption{display:block;margin:8px 0;padding:9px;border:1px solid var(--line);border-radius:7px}.quizoption input{margin-right:8px}.barrow{display:grid;grid-template-columns:120px 1fr 85px;align-items:center;gap:10px;margin:8px 0}.bartrack{background:#e4edf1;border-radius:7px;height:17px;overflow:hidden}.barfill{background:var(--teal);height:100%}.foot{color:var(--muted);font-size:12px;margin-top:16px}.tag{font-size:12px;font-weight:700;color:var(--teal)}@media(max-width:850px){.grid,.three{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media print{header{color:black;background:white}.buttons,.controls,.tabs,.lang{display:none!important}.panel{break-inside:avoid;box-shadow:none}body{background:white}}

const L={fr:{title:'Laboratoire financier interactif',subtitle:'CEFI1 · Efrei · Révision du DE · Prof. Dr. Fabio ANTONIALLI',language:'Langue',missionTitle:'Votre mission',mission:'Vous dirigez NovaTech AI, entreprise fictive de cybersécurité et d’intelligence artificielle. Testez des décisions et observez, dans cet ordre, le compte de résultat, le bilan, puis le FR, le BFR et la trésorerie.',assumptions:'Cas pédagogique simplifié inspiré des exercices de révision : montants en k€, TVA ignorée, année de 360 jours, IS conventionnel de 25 % si le résultat courant est positif.',decisions:'1 · Décisions de gestion',live:'Recalcul automatique',assumptionsMore:'Hypothèses détaillées du modèle',technical:'Une seule période comptable. Capital initial et trésorerie initiale : 150 k€. Pas de réserves, dividendes, remboursements de capital d’emprunt ni créances/dettes fiscales à la clôture. Les salaires, taxes, intérêts et IS sont payés pendant la période. Les achats externes non réglés constituent les dettes fournisseurs. Les stocks sont achetés et payés comptant. Les serveurs sont achetés en début de période et amortis sur une année entière. L’emprunt est décaissé par la banque au début de la période, avec intérêts calculés au taux choisi, sans remboursement de principal. Le modèle suppose que les autres opérations ne changent pas avec l’investissement.',dashboard:'2 · Tableaux financiers synchronisés',footer:'NovaTech AI · Cas fictif à finalité pédagogique · Les formules sont simplifiées pour correspondre aux exercices CEFI1 ; elles ne constituent pas une comptabilité réglementaire exhaustive.',reset:'↺ Réinitialiser',base:'Situation initiale',late:'Clients en retard',cash:'Serveurs · fonds propres',loan:'Serveurs · emprunt',cloud:'Optimiser le cloud',overview:'Vue complète : CR + bilan + FR/BFR',compare:'Avant / Après · investissements',links:'Fil rouge · résultat → bilan',challenge:'Défi de gestion',quiz:'Questions guidées',glossary:'Glossaire',ca:'Chiffre d’affaires',ext:'Achats et charges externes',pers:'Charges de personnel',taxes:'Impôts et taxes d’exploitation',interest:'Charges financières existantes',recv:'CA encaissé (%)',paid:'Charges externes payées (%)',capex:'Achat de serveurs',mode:'Financement des serveurs',none:'Aucun investissement',own:'Fonds propres / trésorerie',borrow:'Emprunt bancaire',rate:'Taux annuel du nouvel emprunt (%)',years:'Durée d’amortissement (ans)',stock:'Stock acheté comptant',cr:'Compte de résultat · SIG et CAF',balance:'Bilan de clôture',asset:'ACTIF · emplois',liab:'PASSIF · ressources',va:'Valeur ajoutée (VA)',ebe:'Excédent brut d’exploitation (EBE)',rex:'Résultat d’exploitation (REX)',rc:'Résultat courant (RC)',rn:'Résultat net (RN)',caf:'Capacité d’autofinancement (CAF)',amort:'Dotations aux amortissements',is:'Impôt sur les sociétés',fin:'Charges financières totales',imm:'Immobilisations nettes',clients:'Créances clients',stocks:'Stocks',bank:'Trésorerie active',capital:'Capital social',result:'Résultat de l’exercice',equity:'Capitaux propres',debt:'Emprunts à long terme',suppliers:'Dettes fournisseurs',overdraft:'Découvert bancaire',total:'TOTAL',fr:'Fonds de roulement (FR)',bfr:'Besoin en fonds de roulement (BFR)',treasury:'Trésorerie nette',check:'Contrôle d’équilibre',cashflow:'Passage de la CAF à la trésorerie',startcash:'Trésorerie initiale',deltaBfr:'Variation du BFR',invest:'Investissement décaissé',newLoan:'Nouvel emprunt encaissé',endcash:'Trésorerie finale',ratio:'Indicateurs complémentaires',margin:'Marge EBE / CA',netmargin:'Marge nette RN / CA',economic:'Rentabilité économique REX / (immob. + BFR)',financial:'Rentabilité financière RN / capitaux propres',clientDays:'Délai clients (jours)',supplierDays:'Délai fournisseurs (jours)',coverage:'Couverture des besoins',equityDebt:'Autonomie financière',noRatio:'n. d.',balanced:'Bilan équilibré',unbalanced:'Écart de bilan',insight:'À retenir',note:'Le résultat net (après IS), et non le résultat courant, figure au passif parmi les capitaux propres. Sa contrepartie à l’actif dépend des opérations : créances, trésorerie, immobilisations ou autres actifs. Le bénéfice ne correspond pas automatiquement à du cash.',link1:'Le compte de résultat détermine le résultat net.',link2:'Le résultat net alimente les capitaux propres au passif.',link3:'Les capitaux propres contribuent aux ressources stables et au FR.',link4:'Le BFR dépend des stocks, créances clients et dettes fournisseurs.',link5:'La trésorerie nette résulte de FR − BFR et correspond à la trésorerie active moins le découvert.',before:'Sans investissement',afterOwn:'Achat sur fonds propres',afterLoan:'Achat avec emprunt',difference:'Écart vs sans investissement',timing:'Distinguer deux moments',instant:'À la date de l’achat : une immobilisation apparaît ; en fonds propres la banque diminue, avec emprunt la dette LT augmente. L’achat ne constitue pas une charge immédiate.',year:'À la clôture : amortissement et éventuels intérêts réduisent le résultat net ; le bilan et les soldes FR/BFR/trésorerie se recalculent.',question:'Question',reveal:'Afficher la correction',next:'Question suivante',correct:'Bonne réponse',tryagain:'Correction',objective:'Objectif : investir tout en maintenant une trésorerie non négative et un résultat net positif.',status:'Diagnostic du scénario',success:'Objectif atteint : résultat net positif et trésorerie non négative.',fail:'Objectif non atteint : examinez les charges, le BFR ou le financement.',profitable:'Entreprise bénéficiaire mais en découvert : bénéfice ≠ trésorerie.',loss:'Résultat net non positif : surveiller la performance.',healthy:'Résultat positif et trésorerie non négative. Vérifiez aussi le niveau du BFR.',explain:'Explication',formula:'Formule',interpretation:'Interprétation',select:'Choisir un terme',click:'Cliquez sur le résultat net ou sur les créances et la trésorerie dans les tableaux pour suivre les liens.',equityHelp:'Résultat net → capitaux propres → FR. Les flux d’encaissement déterminent la répartition entre créances et trésorerie.',receivablesHelp:'Une facture non encaissée accroît les créances et le BFR, sans changer le chiffre d’affaires ni le résultat.',treasuryHelp:'La trésorerie nette est le solde FR − BFR. Un solde négatif est présenté au passif comme découvert bancaire.',noteTax:'L’IS de 25 % est une convention pédagogique du recueil d’exercices, et non une modélisation fiscale complète.'},en:{title:'Interactive financial laboratory',subtitle:'CEFI1 · Efrei · Exam review · Prof. Dr. Fabio ANTONIALLI',language:'Language',missionTitle:'Your mission',mission:'You manage NovaTech AI, a fictional cybersecurity and artificial intelligence company. Test decisions and see the income statement, balance sheet, then working capital, working capital requirement and cash.',assumptions:'Simplified teaching case inspired by the revision exercises: amounts in € thousands, VAT excluded, 360-day year, assumed 25% tax on positive ordinary profit.',decisions:'1 · Management decisions',live:'Live recalculation',assumptionsMore:'Detailed model assumptions',technical:'One accounting period. Initial share capital and cash: €150k. No reserves, dividends, loan principal repayments or unpaid tax balances at year-end. Payroll, operating taxes, interest and corporate tax are paid during the period. Unpaid external expenses become trade payables. Inventory is purchased and paid in cash. Servers are purchased at the start of the period and depreciated for one full year. A new loan is received at the start of the period, with interest at the selected rate and no principal repayment. Other operations are assumed unchanged by the investment.',dashboard:'2 · Linked financial statements',footer:'NovaTech AI · Fictional educational case · Simplified CEFI1 formulas, not a full statutory accounting model.',reset:'↺ Reset',base:'Baseline',late:'Late customer payments',cash:'Servers · own cash',loan:'Servers · loan',cloud:'Optimize cloud costs',overview:'Full view: income + balance + WC',compare:'Before / After · investment',links:'Flow · profit → balance sheet',challenge:'Management challenge',quiz:'Guided questions',glossary:'Glossary',ca:'Revenue',ext:'External purchases and services',pers:'Payroll expenses',taxes:'Operating taxes',interest:'Existing finance costs',recv:'Revenue collected (%)',paid:'External expenses paid (%)',capex:'Server purchase',mode:'Server financing',none:'No investment',own:'Own cash',borrow:'Bank loan',rate:'New loan interest rate (%)',years:'Depreciation period (years)',stock:'Inventory purchased for cash',cr:'Income statement · intermediate margins and CAF',balance:'Closing balance sheet',asset:'ASSETS · uses of funds',liab:'LIABILITIES & EQUITY · funding',va:'Value added (VA)',ebe:'Gross operating surplus (EBE)',rex:'Operating profit (REX)',rc:'Ordinary profit before tax (RC)',rn:'Net profit (RN)',caf:'Self-financing capacity (CAF)',amort:'Depreciation expense',is:'Corporate income tax',fin:'Total finance costs',imm:'Net fixed assets',clients:'Trade receivables',stocks:'Inventory',bank:'Cash assets',capital:'Share capital',result:'Profit for the period',equity:'Total equity',debt:'Long-term loans',suppliers:'Trade payables',overdraft:'Bank overdraft',total:'TOTAL',fr:'Net working capital (FR)',bfr:'Working capital requirement (BFR)',treasury:'Net cash',check:'Balance check',cashflow:'From CAF to cash',startcash:'Opening cash',deltaBfr:'Change in BFR',invest:'Cash paid for investment',newLoan:'New loan proceeds',endcash:'Closing net cash',ratio:'Additional ratios',margin:'EBE margin / revenue',netmargin:'Net margin / revenue',economic:'Return on operating capital REX / (fixed assets + BFR)',financial:'Return on equity RN / equity',clientDays:'Customer payment period (days)',supplierDays:'Supplier payment period (days)',coverage:'Funding coverage',equityDebt:'Financial autonomy',noRatio:'n/a',balanced:'Balance sheet balances',unbalanced:'Balance sheet discrepancy',insight:'Key idea',note:'Net profit (after tax), not ordinary profit before tax, appears in equity on the balance sheet. Its asset-side counterpart depends on actual transactions: receivables, cash, fixed assets or other assets. Profit does not automatically mean cash.',link1:'The income statement calculates net profit.',link2:'Net profit increases equity on the balance sheet.',link3:'Equity contributes to stable financing and working capital.',link4:'The working capital requirement depends on inventory, receivables and trade payables.',link5:'Net cash equals FR − BFR, or cash assets less bank overdrafts.',before:'No investment',afterOwn:'Buy using own cash',afterLoan:'Buy using a bank loan',difference:'Difference vs no investment',timing:'Two distinct moments',instant:'At purchase: fixed assets increase; paying from cash reduces bank funds, whereas borrowing increases long-term debt. The purchase itself is not an immediate expense.',year:'At year-end: depreciation and any interest reduce net profit; the balance sheet and working-capital indicators update.',question:'Question',reveal:'Reveal answer',next:'Next question',correct:'Correct',tryagain:'Expected answer',objective:'Goal: invest while keeping net cash non-negative and net profit positive.',status:'Scenario diagnosis',success:'Goal achieved: positive net profit and non-negative cash.',fail:'Goal not achieved: review expenses, working capital requirement or financing.',profitable:'Profitable but overdrawn: profit is not cash.',loss:'Non-positive net profit: review operating performance.',healthy:'Positive profit and non-negative cash. Also inspect working capital requirement.',explain:'Explanation',formula:'Formula',interpretation:'Interpretation',select:'Choose a term',click:'Click net profit, receivables or cash in the tables to follow their connections.',equityHelp:'Net profit → equity → working capital. Cash collections determine the split between receivables and cash.',receivablesHelp:'An unpaid invoice increases receivables and BFR without changing revenue or profit.',treasuryHelp:'Net cash equals FR − BFR. A negative balance is shown as a bank overdraft on the liabilities side.',noteTax:'The 25% income tax rate is a teaching convention from the exercises, not a full tax calculation.'}};
const defs=[['ca',400,100,900,10],['ext',120,20,400,10],['pers',180,40,350,10],['taxes',0,0,50,5],['interest',5,0,50,1],['recv',37.5,0,100,2.5],['paid',75,0,100,5],['capex',0,0,300,10],['rate',5,0,15,.5],['years',5,1,10,1],['stock',0,0,100,5]];
const base={ca:400,ext:120,pers:180,taxes:0,interest:5,recv:37.5,paid:75,capex:0,mode:'none',rate:5,years:5,stock:0};let s={...base},lang='fr',tab='overview',quizIndex=0,answer=-1,shown=false,selectedTerm='rn';const t=k=>L[lang][k]||k;const num=n=>new Intl.NumberFormat(lang==='fr'?'fr-FR':'en-GB',{maximumFractionDigits:2}).format(Math.abs(n)<.0000001?0:n);const money=n=>num(n)+' k€';const percent=n=>Number.isFinite(n)?num(n)+' %':t('noRatio');const ratio=n=>Number.isFinite(n)?num(n):t('noRatio');
function calc(x=s){let amort=x.capex/x.years,loan=x.mode==='borrow'?x.capex:0,fin=x.interest+loan*x.rate/100,va=x.ca-x.ext,ebe=va-x.pers-x.taxes,rex=ebe-amort,rc=rex-fin,is=Math.max(0,rc)*.25,rn=rc-is,caf=rn+amort,clients=x.ca*(1-x.recv/100),suppliers=x.ext*(1-x.paid/100),bfr=clients+x.stock-suppliers,imm=x.capex-amort,equity=150+rn,fr=equity+loan-imm,cash=fr-bfr,assets=imm+x.stock+clients+Math.max(0,cash),liabs=equity+loan+suppliers+Math.max(0,-cash);return {amort,loan,fin,va,ebe,rex,rc,is,rn,caf,clients,suppliers,bfr,imm,equity,fr,cash,assets,liabs};}
const tr=(k,v,style='',id='')=>`<tr class="${style} ${id?'clickable':''}" ${id?`data-explain="${id}"`:''}><td>${t(k)}</td><td>${money(v)}</td></tr>`;
function income(d){return `<div class="sub"><h3>${t('cr')}</h3><div class="tablewrap"><table>${tr('ca',s.ca,'em')}${tr('ext',-s.ext)}${tr('va',d.va,'em')}${tr('pers',-s.pers)}${tr('taxes',-s.taxes)}${tr('ebe',d.ebe,'em')}${tr('amort',-d.amort)}${tr('rex',d.rex,'em')}${tr('fin',-d.fin)}${tr('rc',d.rc,'em')}${tr('is',-d.is)}${tr('rn',d.rn,'total','rn')}${tr('amort',d.amort)}${tr('caf',d.caf,'total')}</table></div><small>${t('noteTax')}</small></div>`}
function balance(d){return `<div class="sub"><h3>${t('balance')}</h3><div class="grid"><div class="tablewrap"><table><thead><tr><th colspan="2">${t('asset')}</th></tr></thead><tbody>${tr('imm',d.imm)}${tr('stocks',s.stock)}${tr('clients',d.clients,'','clients')}${tr('bank',Math.max(0,d.cash),'','bank')}${tr('total',d.assets,'total')}</tbody></table></div><div class="tablewrap"><table><thead><tr><th colspan="2">${t('liab')}</th></tr></thead><tbody>${tr('capital',150)}${tr('result',d.rn,'em','rn')}${tr('equity',d.equity,'em')}${tr('debt',d.loan)}${tr('suppliers',d.suppliers)}${tr('overdraft',Math.max(0,-d.cash))}${tr('total',d.liabs,'total')}</tbody></table></div></div><div class="notice">${t('check')}: <strong>${Math.abs(d.assets-d.liabs)<1e-7?t('balanced')+' ✓':t('unbalanced')+' '+money(d.assets-d.liabs)}</strong></div></div>`}
function working(d){let den=d.imm+d.bfr;return `<div class="sub"><h3>${t('fr')} · ${t('bfr')} · ${t('treasury')}</h3><table>${tr('equity',d.equity)}${tr('debt',d.loan)}${tr('imm',-d.imm)}${tr('fr',d.fr,'total')}${tr('stocks',s.stock)}${tr('clients',d.clients)}${tr('suppliers',-d.suppliers)}${tr('bfr',d.bfr,'total')}${tr('treasury',d.cash,'total','bank')}</table><div class="equation">${t('fr')} − ${t('bfr')} = ${t('treasury')}<br>${money(d.fr)} − ${money(d.bfr)} = ${money(d.cash)}</div><h3>${t('cashflow')}</h3><table>${tr('startcash',150)}${tr('caf',d.caf)}${tr('deltaBfr',-d.bfr)}${tr('invest',-s.capex)}${tr('newLoan',d.loan)}${tr('endcash',d.cash,'total')}</table><details class="details"><summary>${t('ratio')}</summary><table>${[['margin',d.ebe/s.ca*100,'%'],['netmargin',d.rn/s.ca*100,'%'],['economic',den?d.rex/den*100:NaN,'%'],['financial',d.equity?d.rn/d.equity*100:NaN,'%'],['clientDays',d.clients/s.ca*360,'d'],['supplierDays',s.ext?d.suppliers/s.ext*360:NaN,'d'],['coverage',den?(d.equity+d.loan)/den:NaN,'x'],['equityDebt',d.loan?d.equity/d.loan:NaN,'x']].map(([k,v,unit])=>`<tr><td>${t(k)}</td><td>${unit==='%'?percent(v):ratio(v)+(unit==='d'?' j / days':unit==='x'?' ×':'')}</td></tr>`).join('')}</table></details></div>`}
function overview(d){return `<div class="grid">${income(d)}${balance(d)}</div><div style="margin-top:14px">${working(d)}</div><div class="notice">${t('note')}</div><p class="muted">${t('click')}</p><div id="context" class="notice" style="display:none"></div>`}
function compare(){const candidates=[{...s,capex:0,mode:'none'},{...s,capex:s.capex||100,mode:'own'},{...s,capex:s.capex||100,mode:'borrow'}];let ds=candidates.map(calc),keys=['ca','va','ebe','rex','rc','rn','caf','imm','equity','debt','clients','suppliers','fr','bfr','treasury'];return `<div class="notice">${t('timing')}: <strong>${t('instant')}</strong><p>${t('year')}</p></div><div class="tablewrap"><table><thead><tr><th>${t('ratio')}</th><th>${t('before')}</th><th>${t('afterOwn')}</th><th>${t('afterLoan')}</th></tr></thead><tbody>${keys.map(k=>{let vals=ds.map((d,i)=>k==='ca'?candidates[i].ca:k==='debt'?d.loan:k==='treasury'?d.cash:d[k]);return `<tr class="${['rn','caf','fr','bfr','treasury'].includes(k)?'em':''}"><td>${t(k)}</td>${vals.map((v,i)=>`<td>${money(v)}${i>0?`<br><small>${v-vals[0]>=0?'+':''}${money(v-vals[0])}</small>`:''}</td>`).join('')}</tr>`}).join('')}</tbody></table></div><p class="muted">${lang==='fr'?'Comparaison à hypothèses d’exploitation identiques ; investissement de '+money(s.capex||100)+'. Les intérêts du nouvel emprunt sont calculés à '+num(s.rate)+' %.':'Same operating assumptions; server investment '+money(s.capex||100)+'. New-loan interest rate: '+num(s.rate)+'%.'}</p>`}
function links(d){return `<div class="grid"><div>${income(d)}</div><div>${balance(d)}</div></div><div class="arrow">↓</div><div class="three">${['link1','link2','link3','link4','link5'].map((k,i)=>`<div class="sub"><span class="tag">${i+1}</span><p>${t(k)}</p></div>`).join('')}</div><div style="margin-top:14px">${working(d)}</div><div class="notice">${t('note')}</div>`}
const questions={fr:[['L’entreprise facture 40 k€ supplémentaires, non encaissés et sans charges nouvelles. Quel est l’effet immédiat ?', ['Le CA et les créances augmentent','Seule la trésorerie augmente','Le CA ne change pas'],0,'La facturation augmente le chiffre d’affaires et les créances clients ; elle ne crée pas d’encaissement immédiat.'],['Un client règle une facture déjà comptabilisée. Quel indicateur ne change pas ?', ['La trésorerie','Les créances clients','Le résultat net'],2,'L’encaissement diminue les créances et augmente la trésorerie ; le résultat était déjà constaté à la facturation.'],['Un serveur est acheté à crédit bancaire, pour 100 k€. Quel est l’effet immédiat sur le FR ?', ['+100 k€','0 k€','−100 k€'],1,'Les ressources stables et les immobilisations augmentent du même montant ; le FR reste inchangé à la date d’achat.'],['Quel résultat apparaît au passif du bilan ?', ['Le résultat courant avant impôt','Le résultat net après impôt','L’EBE'],1,'Le bilan reprend le résultat net de l’exercice parmi les capitaux propres.'],['La dotation aux amortissements de l’année augmente. Que se passe-t-il ?', ['Le REX diminue, sans décaissement au titre de la dotation','La trésorerie diminue du même montant','Le CA augmente'],0,'La dotation est une charge calculée. Le cash est sorti lors de l’investissement, pas au moment de l’amortissement.'],['Le délai de paiement clients s’allonge, à CA inchangé. Quel effet ?', ['BFR en baisse','BFR en hausse et trésorerie en baisse','Résultat net en hausse'],1,'Les créances augmentent, donc le BFR augmente et la trésorerie diminue, à autres éléments constants.']],en:[['The company invoices an extra €40k, not yet collected, with no additional costs. Immediate effect?', ['Revenue and receivables rise','Only cash rises','Revenue is unchanged'],0,'Invoices increase revenue and trade receivables; they do not immediately generate cash.'],['A customer pays an invoice already recorded. Which indicator stays unchanged?', ['Cash','Trade receivables','Net profit'],2,'Cash rises and receivables fall. Profit was recognized when invoiced.'],['Servers are purchased using a €100k bank loan. Immediate effect on FR?', ['+€100k','€0','−€100k'],1,'Stable financing and fixed assets rise equally; FR is unchanged at purchase.'],['Which profit appears in equity on the balance sheet?', ['Ordinary profit before tax','Net profit after tax','EBE'],1,'The balance sheet includes net profit for the period in equity.'],['Annual depreciation rises. What happens?', ['Operating profit falls without cash payment for depreciation','Cash falls by the same amount','Revenue rises'],0,'Depreciation is a non-cash expense. Cash was paid when the asset was acquired.'],['Customer payment delays rise, with unchanged revenue. Effect?', ['BFR falls','BFR rises and cash falls','Net profit rises'],1,'Receivables and BFR rise, while cash falls, all else equal.']]};
function quiz(){let q=questions[lang][quizIndex];return `<div class="sub"><span class="pill">${t('question')} ${quizIndex+1} / ${questions[lang].length}</span><h3>${q[0]}</h3>${q[1].map((v,i)=>`<label class="quizoption"><input type="radio" name="q" value="${i}" ${answer===i?'checked':''}>${v}</label>`).join('')}<div class="buttons"><button id="reveal" class="primary" ${answer<0?'disabled':''}>${t('reveal')}</button><button id="next">${t('next')} →</button></div>${shown?`<div class="notice"><strong>${answer===q[2]?t('correct'):t('tryagain')+': '+q[1][q[2]]}</strong><p>${q[3]}</p></div>`:''}</div>`}
const glossary={rn:['RC − IS','Le bénéfice après impôt est repris dans les capitaux propres.','Profit after tax is included in equity.'],caf:['RN + amortissements','Capacité potentielle de financement interne, pas la trésorerie disponible.','Potential internally generated funds, not the same as available cash.'],fr:['Capitaux propres + emprunts LT − immobilisations nettes','Excédent des ressources stables sur les emplois stables.','Stable financing minus net fixed assets.'],bfr:['Stocks + créances clients − dettes fournisseurs','Besoin lié au décalage entre encaissements et paiements d’exploitation.','Operating cash tied up in inventory and receivables, less trade payables.'],treasury:['FR − BFR','Cash net après financement du cycle d’exploitation.','Net cash remaining after funding the operating cycle.'],va:['CA − achats et charges externes','Richesse créée après consommations externes.','Value created after external purchases and services.'],ebe:['VA − personnel − taxes d’exploitation','Performance d’exploitation avant amortissements et financement.','Operating performance before depreciation and financing.'],rex:['EBE − amortissements','Performance d’exploitation après usure comptable des actifs.','Operating profit after depreciation.'],rc:['REX − charges financières','Résultat avant impôt après coût du financement.','Profit before tax after finance costs.'],clients:['CA facturé − CA encaissé','Factures non encaissées, sans nouvelle reconnaissance du résultat lors du paiement.','Uncollected invoices; payment does not recognize profit again.']};
function glossaryView(){return `<div class="sub"><label>${t('select')} <select id="term">${Object.keys(glossary).map(k=>`<option value="${k}" ${selectedTerm===k?'selected':''}>${t(k)}</option>`).join('')}</select></label><h3>${t(selectedTerm)}</h3><p><strong>${t('formula')}:</strong> ${glossary[selectedTerm][0]}</p><p><strong>${t('interpretation')}:</strong> ${glossary[selectedTerm][lang==='fr'?1:2]}</p></div>`}
function challenge(d){return `<div class="sub"><h3>${t('objective')}</h3><div class="equation">${t('rn')}: ${money(d.rn)} · ${t('treasury')}: ${money(d.cash)}</div><div class="notice ${d.rn>0&&d.cash>=0&&s.capex>0?'':'warning'}"><strong>${t('status')}:</strong> ${s.capex>0&&d.rn>0&&d.cash>=0?t('success'):t('fail')}</div><p>${lang==='fr'?'Modifiez le financement, les délais de paiement et les coûts cloud en haut de page, puis revenez ici pour défendre votre décision.':'Adjust financing, payment terms and cloud costs above, then return to defend your decision.'}</p></div>`}
function renderControls(){document.getElementById('controls').innerHTML=defs.map(([id,v,min,max,step])=>`<div class="control"><label for="c_${id}"><span>${t(id)}</span><output id="o_${id}">${id==='recv'||id==='paid'||id==='rate'?percent(s[id]):id==='years'?num(s[id]):money(s[id])}</output></label><input type="range" id="c_${id}" min="${min}" max="${max}" step="${step}" value="${s[id]}"></div>`).join('')+`<div class="control"><label for="c_mode">${t('mode')}</label><select id="c_mode" style="width:100%;padding:8px;margin-top:10px"><option value="none">${t('none')}</option><option value="own">${t('own')}</option><option value="borrow">${t('borrow')}</option></select></div>`;defs.forEach(([id])=>document.getElementById('c_'+id).addEventListener('input',e=>{s[id]=+e.target.value;if(id==='capex'&&s.capex>0&&s.mode==='none')s.mode='own';render()}));document.getElementById('c_mode').value=s.mode;document.getElementById('c_mode').addEventListener('change',e=>{s.mode=e.target.value;if(s.mode==='none')s.capex=0;else if(!s.capex)s.capex=100;render()});}
function preset(id){s={...base};if(id==='late')s.recv=20;if(id==='cash'){s.capex=100;s.mode='own'}if(id==='loan'){s.capex=100;s.mode='borrow'}if(id==='cloud')s.ext=90;render()}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.id===lang));document.getElementById('presets').innerHTML=['base','late','cash','loan','cloud'].map(k=>`<button data-preset="${k}">${t(k)}</button>`).join('')+`<button data-preset="base">${t('reset')}</button>`;document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>preset(b.dataset.preset));renderControls();let d=calc();document.getElementById('kpis').innerHTML=['rn','caf','bfr','treasury'].map(k=>{let v=k==='treasury'?d.cash:d[k];return `<div class="kpi"><span>${t(k)}</span><strong class="${v<0?'negative':'positive'}">${money(v)}</strong></div>`}).join('');document.getElementById('diagnostic').textContent=d.rn>0&&d.cash<0?t('profitable'):d.rn<=0?t('loss'):t('healthy');let tabs=['overview','compare','links','challenge','quiz','glossary'];document.getElementById('tabs').innerHTML=tabs.map(k=>`<button data-tab="${k}" class="${tab===k?'active':''}">${t(k)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('content').innerHTML=tab==='overview'?overview(d):tab==='compare'?compare():tab==='links'?links(d):tab==='challenge'?challenge(d):tab==='quiz'?quiz():glossaryView();document.querySelectorAll('[data-explain]').forEach(el=>el.onclick=()=>{let box=document.getElementById('context');if(!box){tab='overview';render();box=document.getElementById('context')}box.style.display='block';box.textContent=t(el.dataset.explain==='rn'?'equityHelp':el.dataset.explain==='clients'?'receivablesHelp':'treasuryHelp');box.scrollIntoView({block:'nearest',behavior:'smooth'})});if(tab==='quiz'){document.querySelectorAll('input[name=q]').forEach(el=>el.onchange=()=>{answer=+el.value;shown=false;render()});document.getElementById('reveal').onclick=()=>{shown=true;render()};document.getElementById('next').onclick=()=>{quizIndex=(quizIndex+1)%questions[lang].length;answer=-1;shown=false;render()}}if(tab==='glossary')document.getElementById('term').onchange=e=>{selectedTerm=e.target.value;render()}}
function setLang(v){lang=v;render()}render();
</script></body></html>
